---
- hosts: ubuntu
  become: yes
  tasks:
  - name: Instalacion de aplicaciones y software base
    ansible.builtin.apt:
      name:
        - wget
        - curl
        - ca-certificates
        - vim-nox
        - screen
        - tmux
        - nano
      state: latest

  - name: Asegurarse de que existe el grupo "Administrator"
    ansible.builtin.group:
      name: administrator
      state: present

  - name: Crear el usuario Administrator, asignarle el grupo, y crear una llave privada SSH
    ansible.builtin.user:
      name: administrator
      generate_ssh_key: yes
      ssh_key_bits: 4096
      ssh_key_file: ".ssh/id_rsa"
      groups: administrator, sudo
      shell: /bin/bash
      append: yes
      
  - name: Copiar archivo de llaves publicas de administradores
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../../files/ssh/administrator-authorized_keys"
      dest: "/home/administrator/.ssh/authorized_keys"
      backup: no
      owner: administrator
      group: administrator
      mode: 0600

  - name: Crear una llave privada SSH a root
    ansible.builtin.user:
      name: root
      generate_ssh_key: yes
      ssh_key_bits: 4096
      ssh_key_file: ".ssh/id_rsa"
      state: present
      force: no

  - name: Copiar archivo de llaves publicas de masters
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../../files/ssh/root-authorized_keys"
      dest: "/root/.ssh/authorized_keys"
      backup: no
      owner: root
      group: root
      mode: 0600

  - name: Copiar archivo de sudoers
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../../files/sudo/administrator"
      dest: "/etc/sudoers.d/administrator"
      backup: no
      owner: root
      group: root
      mode: 0644
